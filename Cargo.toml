[package]
name = "turbo_atlas_icons"


description = "A system for declarative ui icon rendering with Bevy"
authors = [ "ethereumdegen" ]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ethereumdegen/turbo_atlas_icons"
version = "0.17.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.0" , features = [ "jpeg", "tga", "serialize"  ] } 
bevy_asset_loader = { version = "0.24.0" , features = ["progress_tracking","2d","standard_dynamic_assets"] }


  